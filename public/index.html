<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldX AI - مساعدك بالدارجة المغربية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #334155; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 75%; line-height: 1.5; word-wrap: break-word; }
        .user { background-color: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background-color: #334155; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-container { display: flex; padding: 15px; background-color: #1e293b; border-top: 1px solid #334155; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 16px; outline: none; }
        button { background-color: #10b981; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #059669; }
    </style>
</head>
<body>
    <header>🌐 WorldX AI - الدارجة المغربية</header>
    <div id="chat-container">
        <div class="message ai">أهلاً بك يا بطل! أنا مساعدك الذكي في WorldX AI. كيف يمكنني مساعدتك اليوم بالدارجة؟</div>
    </div>
    <div id="input-container">
        <input type="text5" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="message ai">جاري التفكير...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                document.getElementById(loadingId).remove();
                
                if (data.reply) {
                    container.innerHTML += `<div class="message ai">${data.reply}</div>`;
                } else {
                    container.innerHTML += `<div class="message ai">عذراً، حدث خطأ في الرد.</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message ai">خطأ في الاتصال بالخادم.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
